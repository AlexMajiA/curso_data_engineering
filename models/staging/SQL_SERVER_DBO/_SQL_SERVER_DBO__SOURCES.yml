sources:

  - name: SQL_SERVER_DBO # name of the source 
    schema: SQL_SERVER_DBO # this is the schema our raw data lives in
    database: ALUMNO3_DEV_BRONZE_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      warn_after: {count: 500, period: hour}
      error_after: {count: 500, period: day}

    tables:

      - name: ADDRESSES
        loaded_at_field: _fivetran_synced
        columns:
          - name: ADDRESS_ID
            data_tests:
               - not_null
               - unique
          - name: ZIPCODE
            data_tests:
               - not_null
          - name: COUNTRY
            data_tests:
               - not_null
          - name: ADDRESS
            data_tests:
               - not_null
               - unique
          - name: STATE
            data_tests:
               - not_null
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: EVENTS
        loaded_at_field: _fivetran_synced
        columns:
          - name: EVENT_ID
            data_tests:
               - not_null
               - unique
          - name: PAGE_URL
            data_tests:
               - not_null
               - unique
          - name: EVENT_TYPE
            data_tests:
               - not_null
          - name: USER_ID
            data_tests:
               - not_null
               - unique
               - relationships:
                  to: source('SQL_SERVER_DBO','USERS')
                  field: USER_ID
          - name: PRODUCT_ID
            data_tests:
               - unique
               - relationships:
                  to: source('SQL_SERVER_DBO','PRODUCTS')
                  field: PRODUCT_ID
          - name: SESSION_ID
            data_tests:
               - not_null
               - unique
          - name: CREATED_AT
            data_tests:
               - not_null
          - name: ORDER_ID
            data_tests:
               - unique
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: ORDERS
        loaded_at_field: _fivetran_synced
        columns:
          - name: ORDER_ID
            data_tests:
               - not_null
               - unique
               - relationships:
                  to: source('SQL_SERVER_DBO','ORDER_ITEMS')
                  field: ORDER_ID
          - name: SHIPPING_SERVICE
          - name: SHIPPING_COST
            data_tests:
               - not_null
          - name: ADDRESS_ID
            data_tests:
               - not_null
          - name: CREATED_AT
            data_tests:
               - not_null
          - name: PROMO_ID
          - name: ESTIMATED_DELIVERY_AT
          - name: ORDER_COST
            data_tests:
               - not_null
          - name: USER_ID
          - name: ORDER_TOTAL
            data_tests:
               - not_null
               - unique
          - name: DELIVERED_AT
          - name: TRACKING_ID
          - name: STATUS
            data_tests:
              - not_null
              - unique
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: ORDER_ITEMS
        loaded_at_field: _fivetran_synced
        columns:
          - name: ORDER_ID
            data_tests:
               - not_null
               - unique
               - relationships:
                  to: source('SQL_SERVER_DBO','ORDERS')
                  field: ORDER_ID
          - name: PRODUCT_ID
            data_tests:
               - not_null
               - unique
               - relationships:
                  to: source('SQL_SERVER_DBO','PRODUCTS')
                  field: PRODUCT_ID
          - name: QUANTITY
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: PRODUCTS
        loaded_at_field: _fivetran_synced
        columns:
          - name: PRODUCT_ID
            data_tests:
               - not_null
               - unique
               - relationships:
                  to: source('SQL_SERVER_DBO','ORDER_ITEMS')
                  field: PRODUCT_ID
          - name: PRICE
            data_tests:
               - not_null
          - name: NAME
            data_tests:
               - not_null
          - name: INVENTORY
            data_tests:
               - not_null
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: PROMOS
        loaded_at_field: _fivetran_synced
        columns:
          - name: PROMO_ID
          - name: DISCOUNT  
          - name: STATUS
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: USERS
        loaded_at_field: _fivetran_synced
        columns:
          - name: USER_ID
          - name: UPDATED_AT
          - name: ADDRESS_ID
          - name: LAST_NAME
          - name: CREATED_AT
          - name: PROMO_IPHONE_NUMBERD
          - name: TOTAL_ORDERS
          - name: FIRST_NAME
          - name: EMAIL
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED